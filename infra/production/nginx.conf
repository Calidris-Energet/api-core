user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 768;
}

http {

        sendfile on;
        tcp_nopush on;
        types_hash_max_size 2048;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        gzip on;

        include /etc/nginx/conf.d/*.conf;

        server {
                listen 443 ssl;

                server_name energet.shop;

                ssl_certificate /etc/letsencrypt/live/energet.shop/fullchain.pem;
                ssl_certificate_key /etc/letsencrypt/live/energet.shop/privkey.pem;

                root  /usr/share/nginx/html;
                index index.html index.htm index.nginx-debian.html;

                location /grafana/ {
                    proxy_pass http://grafana:3000/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location / {
                    try_files $uri $uri/ /index.html;
                }

                location /api/ {
                    proxy_pass http://api:3000;
                }

                location /images/ {
                    proxy_pass http://minio:9000;
                }

                location /collect {
                  if ($request_method = OPTIONS) {
                    add_header 'Access-Control-Allow-Origin' 'http://energet.shop';
                    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, x-faro-session-id';
                    add_header 'Access-Control-Allow-Credentials' 'true';
                    add_header 'Content-Length' '0';
                    add_header 'Content-Type' 'text/plain';
                    return 204;
                  }

                  add_header 'Access-Control-Allow-Origin' 'http://energet.shop';
                  add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                  add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, x-faro-session-id';
                  add_header 'Access-Control-Allow-Credentials' 'true';

                  proxy_pass http://alloy:8027/collect;

                  proxy_http_version 1.1;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                }
        }
}
